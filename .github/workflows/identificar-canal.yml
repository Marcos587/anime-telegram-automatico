name: Identificar canal de Telegram

on:
  workflow_dispatch:

jobs:
  identificar:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar actualizaciones
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"

          with urllib.request.urlopen(url, timeout=20) as response:
              data = json.load(response)

          if not data.get("ok"):
              raise SystemExit("No se pudieron consultar las actualizaciones.")

          found = False

          for update in data.get("result", []):
              message = (
                  update.get("channel_post")
                  or update.get("edited_channel_post")
              )

              if message:
                  chat = message["chat"]
                  print("Canal:", chat.get("title", "Sin nombre"))
                  print("ID del canal:", chat["id"])
                  found = True

          if not found:
              print("No hay mensajes de canal pendientes.")
              print("Publica un mensaje nuevo en tu canal y vuelve a ejecutar.")
          PY
